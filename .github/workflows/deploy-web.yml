name: Deploy website (manual)

# يدوي فقط: من تبويب Actions ← Deploy website ← Run workflow
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'تجربة بدون نشر (yes/no)'
        default: 'no'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript lock (real bugs only)
        run: npm i -g typescript@5.9.3 >/dev/null && node web/ts-lint.mjs
      - name: Deploy wird-azkar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web-deploy/deploy.mjs ${{ github.event.inputs.dry == 'yes' && '--dry' || '' }}
      - name: Save site source snapshot (branch site-source)
        if: always()
        run: |
          [ -d site-source ] || { echo "no snapshot"; exit 0; }
          cd site-source && git init -q && git checkout -q -b site-source && git add -A
          git -c user.name=wird-deploy -c user.email=deploy@users.noreply.github.com commit -qm "Site source snapshot ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site-source
