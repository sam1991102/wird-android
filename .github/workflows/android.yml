name: Build Android

on:
  push:
    branches: [main]
    # الموقع بيتنشر لوحده والتطبيق بيفتحه من الإنترنت، فتعديلات web/ و qa/ مش محتاجة نسخة أندرويد جديدة
    paths-ignore: ['web/**', 'qa/**', 'web-deploy/**', '.github/workflows/deploy-web.yml', '.github/workflows/qa.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install & sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wird-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/wird-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK + AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: wird
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            echo "::warning::No signing key secrets yet - building a test (debug) APK only"
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          if ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk out/wird-${{ github.run_number }}.apk
            cp android/app/build/outputs/bundle/release/*.aab out/wird-${{ github.run_number }}.aab
          else
            cp android/app/build/outputs/apk/debug/*.apk out/wird-${{ github.run_number }}-test.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wird-android-${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: وِرد أندرويد 1.0.${{ github.run_number }}
          files: out/*
