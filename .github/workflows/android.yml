name: Build Android

on:
  push:
    branches: [main]
    # الموقع متحزّم جوه التطبيق (web/app-bundle.mjs)، فأي تعديل في web/ لازم يطلع في نسخة أندرويد جديدة
    paths-ignore: ['qa/**', '.github/workflows/deploy-web.yml', '.github/workflows/qa.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bundle the website inside the app (works offline)
        run: node web/app-bundle.mjs

      - name: Install & sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android
          test -s android/app/src/main/assets/public/app-files.json

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wird-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/wird-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Restore Firebase config (Crashlytics)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > android/app/google-services.json; else echo "::notice::No GOOGLE_SERVICES_JSON_B64 secret - building without Crashlytics"; fi

      - name: Build APK + AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: wird
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            echo "::warning::No signing key secrets yet - building a test (debug) APK only"
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect outputs
        run: |
          mkdir -p out
          if ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk out/wird-${{ github.run_number }}.apk
            # نسخة باسم ثابت عشان رابط «آخر نسخة» يفضل شغال دايمًا: releases/latest/download/wird.apk
            cp android/app/build/outputs/apk/release/*.apk out/wird.apk
            cp android/app/build/outputs/bundle/release/*.aab out/wird-${{ github.run_number }}.aab
          else
            cp android/app/build/outputs/apk/debug/*.apk out/wird-${{ github.run_number }}-test.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: wird-android-${{ github.run_number }}
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: وِرد أندرويد 1.0.${{ github.run_number }}
          files: out/*
