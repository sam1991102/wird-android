name: Android device test

# بيجرّب التطبيق الحقيقي على محاكي أندرويد ١٣: ترقية من غير ضياع بيانات، من غير إنترنت، الأذان والمنبّه،
# روابط الإشعارات، وأخطاء JS والانهيارات. النتيجة والصور بتتنشر في فرع device-shots.
on:
  workflow_run:
    workflows: ["Build Android"]
    types: [completed]
  push:
    branches: [main]
    paths: ['qa/device/**', '.github/workflows/device-test.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLD_REF: 174da6e   # آخر نسخة كانت بتفتح الموقع من الإنترنت (1.0.82)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Build OLD debug APK (loads the live site)
        run: |
          git worktree add ../old "$OLD_REF"
          cd ../old && (npm ci || npm install) && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon -q assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/old.apk"

      - name: Build NEW debug APK (site bundled inside)
        run: |
          node web/app-bundle.mjs
          (npm ci || npm install) && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon -q assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/new.apk"

      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1
          git worktree remove --force ../old || rm -rf ../old
          rm -rf android/app/build android/build node_modules ~/.gradle/caches ~/.npm
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (Android 13)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          ram-size: 4096M
          emulator-boot-timeout: 1200
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: node qa/device/run.mjs old.apk new.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: device-test, path: qa/device/out, retention-days: 7 }

      - name: Publish report to device-shots branch
        if: always()
        run: |
          cd qa/device/out && git init -q && git checkout -q -b device-shots && git add -A
          git -c user.name=qa -c user.email=qa@users.noreply.github.com commit -qm "device test ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" device-shots
