name: QA live site
on:
  workflow_run:
    workflows: ["Deploy website (manual)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sleep 60 && node qa/qa.mjs
        env: { SITE: https://wird-azkar.pages.dev/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa, path: qa/out, retention-days: 7 }
      - name: Publish screenshots to qa-shots branch
        if: always()
        run: |
          cd qa/out && git init -q && git checkout -q -b qa-shots && git add -A
          git -c user.name=qa -c user.email=qa@users.noreply.github.com commit -qm "QA ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" qa-shots
